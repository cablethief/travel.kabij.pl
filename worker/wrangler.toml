name = "contravel-images-api"
main = "src/index.ts"
compatibility_date = "2026-07-25"

[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "contravel-images"
# No preview_bucket_name: `wrangler dev` (local mode, the default) emulates
# R2 in-memory and never touches a real bucket. A preview bucket only
# matters for `wrangler dev --remote`, which this project doesn't use.

[vars]
CF_ACCESS_TEAM_DOMAIN = "https://lucatiel.cloudflareaccess.com"
CF_ACCESS_AUD = "0f10c3134c9cc1bd8f868f9733480d205f22618da88287303e6d4204198a380c"
PUBLIC_IMAGES_BASE_URL = "https://images.travel.kabij.pl"

# Access cannot protect the default *.workers.dev subdomain — attach a
# custom hostname here (or via the dashboard's Workers "Custom Domains" tab)
# once the Access Application from the README's manual setup steps exists.
[[routes]]
pattern = "images-api.travel.kabij.pl"
custom_domain = true
